<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -720 12600 3840" width="2520" height="768" role="img" aria-labelledby="t118">
  <title id="t118">Apple Cabin 11.8 m floor plan — 26.5 m². Two bedrooms with 1500 × 2000 beds and wardrobes at either end, central bathroom, kitchen run with sink and hob, and a living area with two armchairs. External 11800 × 2250 mm.</title>
  <style>
    .bg{fill:#faf6ef}
    .wall{fill:none;stroke:#1c1b17;stroke-width:16}
    .wallf{fill:#faf6ef;stroke:#1c1b17;stroke-width:14}
    .fx{fill:none;stroke:#3f3a32;stroke-width:12;stroke-linejoin:round;stroke-linecap:round}
    .fine{fill:none;stroke:#67635a;stroke-width:8;stroke-linecap:round}
    .swing{fill:none;stroke:#67635a;stroke-width:7}
    .glass{fill:none;stroke:#1c1b17;stroke-width:9}
    .dim{fill:none;stroke:#67635a;stroke-width:9}
    .ext{fill:none;stroke:#67635a;stroke-width:7}
    text{font-family:Inter,'Helvetica Neue',Arial,sans-serif}
    .lbl{font-size:270px;font-weight:700;fill:#1c1b17;text-anchor:middle;paint-order:stroke;stroke:#faf6ef;stroke-width:55;stroke-linejoin:round}
    .num{font-size:245px;fill:#67635a;text-anchor:middle;letter-spacing:5px;paint-order:stroke;stroke:#faf6ef;stroke-width:55;stroke-linejoin:round}
    .dimtxt{font-size:235px;fill:#67635a;text-anchor:middle}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#67635a"/>
    </marker>
    <g id="chair">
      <rect class="fx" x="-200" y="-230" width="400" height="105" rx="45"/>
      <rect class="fx" x="-155" y="-125" width="310" height="290" rx="50"/>
      <rect class="fine" x="-200" y="-125" width="50" height="240" rx="24"/>
      <rect class="fine" x="150" y="-125" width="50" height="240" rx="24"/>
    </g>
  </defs>

  <rect class="bg" x="-160" y="-720" width="12600" height="3840"/>

  <!-- shell -->
  <rect class="wall" x="0" y="0" width="11800" height="2250"/>
  <rect class="wall" x="75" y="75" width="11650" height="2100"/>

  <!-- end-wall windows -->
  <path class="glass" d="M0 400 L0 1600 M37 400 L37 1600 M75 400 L75 1600 M0 400 L75 400 M0 1600 L75 1600"/>
  <path class="glass" d="M11800 400 L11800 1600 M11763 400 L11763 1600 M11725 400 L11725 1600 M11725 400 L11800 400 M11725 1600 L11800 1600"/>

  <!-- partitions with bedroom doors -->
  <rect class="wallf" x="2960" y="75" width="70" height="1255"/>
  <rect class="wallf" x="2960" y="2070" width="70" height="105"/>
  <path class="fx" d="M2995 2070 L2275 2070"/>
  <path class="swing" d="M2275 2070 A720 720 0 0 0 2995 1350"/>

  <rect class="wallf" x="8770" y="75" width="70" height="1255"/>
  <rect class="wallf" x="8770" y="2070" width="70" height="105"/>
  <path class="fx" d="M8805 2070 L9525 2070"/>
  <path class="swing" d="M9525 2070 A720 720 0 0 1 8805 1350"/>

  <!-- bathroom enclosure -->
  <rect class="wallf" x="3030" y="1120" width="60" height="70"/>
  <rect class="wallf" x="3830" y="1120" width="1620" height="70"/>
  <path class="fx" d="M3090 1155 L3090 1895"/>
  <path class="swing" d="M3090 1895 A740 740 0 0 0 3830 1155"/>

  <!-- shower -->
  <rect class="fx" x="3090" y="115" width="670" height="965"/>
  <rect class="fine" x="3145" y="170" width="560" height="855"/>
  <circle class="fine" cx="3425" cy="600" r="45"/>
  <path class="fine" d="M3090 300 L3200 300"/>
  <circle class="fine" cx="3240" cy="300" r="55"/>

  <!-- basin -->
  <path class="fine" d="M4180 80 L4180 140"/>
  <circle class="fine" cx="4180" cy="150" r="45"/>
  <circle class="fx" cx="4180" cy="380" r="195"/>
  <circle class="fine" cx="4180" cy="380" r="115"/>

  <!-- toilet -->
  <rect class="fx" x="4660" y="80" width="600" height="170" rx="25"/>
  <rect class="fine" x="4900" y="250" width="120" height="55"/>
  <ellipse class="fx" cx="4960" cy="500" rx="265" ry="235"/>
  <ellipse class="fine" cx="4960" cy="500" rx="165" ry="145"/>

  <text class="lbl" x="4390" y="950">bathroom</text>

  <!-- kitchen: sink, drainer, hob -->
  <rect class="fx" x="5530" y="75" width="1950" height="605"/>
  <rect class="fine" x="5610" y="150" width="640" height="400" rx="30"/>
  <rect class="fine" x="5675" y="215" width="510" height="270" rx="25"/>
  <circle class="fine" cx="5930" cy="120" r="50"/>
  <circle class="fine" cx="5790" cy="120" r="30"/>
  <circle class="fine" cx="6070" cy="120" r="30"/>
  <path class="fine" d="M6360 215 L6740 215 M6360 290 L6740 290 M6360 365 L6740 365 M6360 440 L6740 440 M6360 515 L6740 515"/>
  <rect class="fine" x="6860" y="140" width="560" height="440" rx="20"/>
  <circle class="fine" cx="6990" cy="255" r="80"/>
  <circle class="fine" cx="7290" cy="255" r="80"/>
  <circle class="fine" cx="6990" cy="465" r="80"/>
  <circle class="fine" cx="7290" cy="465" r="80"/>
  <text class="lbl" x="6480" y="930">kitchen</text>

  <!-- living area -->
  <use href="#chair" transform="translate(7830 620) rotate(-25)"/>
  <use href="#chair" transform="translate(8490 620) rotate(25)"/>
  <circle class="fx" cx="8160" cy="230" r="145"/>
  <circle class="fine" cx="8160" cy="230" r="80"/>
  <circle class="fx" cx="8160" cy="1150" r="185"/>
  <text class="lbl" x="7450" y="1660">living room</text>

  <!-- wardrobes -->
  <rect class="fx" x="2410" y="75" width="550" height="1355"/>
  <path class="fine" d="M2890 130 L2890 1375"/>
  <path class="fine" d="M2860 130 L2480 234 L2860 338 L2480 441 L2860 545 L2480 649 L2860 753 L2480 857 L2860 960 L2480 1064 L2860 1168 L2480 1272 L2860 1375"/>

  <rect class="fx" x="8840" y="75" width="550" height="1355"/>
  <path class="fine" d="M8910 130 L8910 1375"/>
  <path class="fine" d="M8940 130 L9320 234 L8940 338 L9320 441 L8940 545 L9320 649 L8940 753 L9320 857 L8940 960 L9320 1064 L8940 1168 L9320 1272 L8940 1375"/>

  <!-- beds -->
  <rect class="fx" x="205" y="110" width="1500" height="2000" rx="45"/>
  <rect class="fine" x="270" y="170" width="655" height="375" rx="55"/>
  <rect class="fine" x="985" y="170" width="655" height="375" rx="55"/>
  <path class="fine" d="M205 830 C615 700 1035 595 1375 580 L1705 580"/>
  <text class="num" x="955" y="1180">1500 × 2000</text>
  <text class="lbl" x="955" y="1560">bedroom 1</text>

  <rect class="fx" x="10095" y="110" width="1500" height="2000" rx="45"/>
  <rect class="fine" x="10160" y="170" width="655" height="375" rx="55"/>
  <rect class="fine" x="10875" y="170" width="655" height="375" rx="55"/>
  <path class="fine" d="M11595 830 C11185 700 10765 595 10425 580 L10095 580"/>
  <text class="num" x="10845" y="1180">1500 × 2000</text>
  <text class="lbl" x="10845" y="1560">bedroom 2</text>

  <!-- glazed wall + entrance -->
  <path class="glass" d="M75 2140 L4160 2140 M75 2195 L4160 2195 M75 2250 L4160 2250 M75 2140 L75 2250 M4160 2140 L4160 2250"/>
  <path class="glass" d="M4930 2140 L11725 2140 M4930 2195 L11725 2195 M4930 2250 L11725 2250 M4930 2140 L4930 2250 M11725 2140 L11725 2250"/>
  <path class="fx" d="M4160 2250 L4160 3020"/>
  <path class="swing" d="M4160 3020 A770 770 0 0 0 4930 2250"/>

  <!-- dimensions -->
  <path class="ext" d="M0 -40 L0 -560 M11800 -40 L11800 -560"/>
  <path class="dim" d="M0 -420 L11800 -420" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="dimtxt" x="5900" y="-500">11800</text>

  <path class="ext" d="M11840 0 L12220 0 M11840 2250 L12220 2250"/>
  <path class="dim" d="M12130 0 L12130 2250" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="dimtxt" x="12300" y="1125" dominant-baseline="central" transform="rotate(-90 12300 1125)">2250</text>
</svg>
