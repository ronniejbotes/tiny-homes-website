  <circle class="fx" cx="3440" cy="1030" r="170"/>
  <circle class="fine" cx="3440" cy="1030" r="100"/>
  <circle class="fine" cx="3440" cy="790" r="48"/>

  <rect class="fx" x="3260" y="1500" width="850" height="650"/>
  <path class="fine" d="M3260 1500 L4110 2150 M4110 1500 L3260 2150"/>

  <rect class="fx" x="4880" y="1450" width="700" height="1150" rx="15"/>
  <rect class="fine" x="4935" y="1505" width="590" height="1040" rx="10"/>
  <circle class="fine" cx="5230" cy="2025" r="45"/>

  <rect class="fx" x="5450" y="400" width="170" height="420" rx="25"/>
  <rect class="fine" x="5390" y="560" width="60" height="110"/>
  <ellipse class="fx" cx="5180" cy="610" rx="240" ry="195"/>
  <ellipse class="fine" cx="5180" cy="610" rx="150" ry="125"/>

  <text class="lbl" x="4430" y="1090">bathroom</text>

  <path class="fx" d="M4180 3175 L4180 2395"/>
  <path class="swing" d="M4180 2395 A780 780 0 0 1 4960 3175"/>
  <path class="fine" d="M4180 3175 L4180 3250 M4960 3175 L4960 3250"/>

  <!-- bedroom 2: bed + seating pair -->
  <rect class="fx" x="5900" y="150" width="1800" height="2000" rx="40"/>
  <rect class="fine" x="5960" y="200" width="810" height="350" rx="50"/>
  <rect class="fine" x="6830" y="200" width="810" height="350" rx="50"/>
  <path class="fine" d="M5900 1030 C6300 780 6850 650 7280 635 L7700 635"/>

  <path class="fx" d="M8680 380 L9220 380 A200 200 0 0 1 9420 580 L9420 860 A200 200 0 0 1 9220 1060 L8680 1060"/>
  <path class="fine" d="M8765 455 L9180 455 A135 135 0 0 1 9315 590 L9315 850 A135 135 0 0 1 9180 985 L8765 985"/>
  <path class="fx" d="M8680 1430 L9220 1430 A200 200 0 0 1 9420 1630 L9420 1910 A200 200 0 0 1 9220 2110 L8680 2110"/>
  <path class="fine" d="M8765 1505 L9180 1505 A135 135 0 0 1 9315 1640 L9315 1900 A135 135 0 0 1 9180 2035 L8765 2035"/>
  <circle class="fx" cx="9050" cy="1245" r="150"/>
  <circle class="fine" cx="9050" cy="1245" r="85"/>

  <text class="lbl" x="7800" y="2790">bedroom 2</text>

  <path class="fx" d="M5900 3175 L5900 2395"/>
  <path class="swing" d="M5900 2395 A780 780 0 0 1 6680 3175"/>
  <path class="fine" d="M5900 3175 L5900 3250 M6680 3175 L6680 3250"/>

  <!-- balcony -->
  <text class="lbl" x="10640" y="1720">balcony</text>

  <!-- dimensions -->
  <path class="ext" d="M0 -40 L0 -560 M11500 -40 L11500 -560"/>
  <path class="dim" d="M0 -420 L11500 -420" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="dimtxt" x="5750" y="-500">11500</text>

  <path class="ext" d="M11540 0 L11920 0 M11540 3250 L11920 3250"/>
  <path class="dim" d="M11830 0 L11830 3250" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="dimtxt" x="12000" y="1625" dominant-baseline="central" transform="rotate(-90 12000 1625)">3250</text>
</svg>
