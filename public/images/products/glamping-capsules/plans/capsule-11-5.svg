  <path class="wall" d="M350 0 L11150 0 L11500 350 L11500 2900 L11150 3250 L350 3250 L0 2900 L0 350 Z"/>
  <path class="wall" d="M381 75 L11119 75 L11425 381 L11425 2869 L11119 3175 L381 3175 L75 2869 L75 381 Z"/>

  <!-- 270° glazing to each bedroom -->
  <path class="glass" d="M0 700 L0 2550 M37 700 L37 2550 M75 700 L75 2550 M0 700 L75 700 M0 2550 L75 2550"/>
  <path class="glass" d="M700 0 L3150 0 M700 37 L3150 37 M700 75 L3150 75 M700 0 L700 75 M3150 0 L3150 75"/>
  <path class="glass" d="M700 3250 L2280 3250 M700 3213 L2280 3213 M700 3175 L2280 3175 M700 3175 L700 3250"/>
  <path class="glass" d="M5720 0 L9800 0 M5720 37 L9800 37 M5720 75 L9800 75 M5720 0 L5720 75 M9800 0 L9800 75"/>
  <path class="glass" d="M6680 3250 L9800 3250 M6680 3213 L9800 3213 M6680 3175 L9800 3175 M9800 3175 L9800 3250"/>
  <path class="glass" d="M11500 700 L11500 2550 M11463 700 L11463 2550 M11425 700 L11425 2550 M11425 700 L11500 700 M11425 2550 L11500 2550"/>

  <!-- partitions -->
  <rect class="wallf" x="3150" y="75" width="70" height="3100"/>
  <rect class="wallf" x="5650" y="75" width="70" height="3100"/>
  <rect class="wallf" x="9800" y="75" width="60" height="1075"/>
  <rect class="wallf" x="9800" y="2200" width="60" height="975"/>
  <path class="glass" d="M9800 1200 L9800 2150 M9830 1200 L9830 2150 M9860 1200 L9860 2150"/>
  <path class="fx" d="M9905 1250 L9905 2100"/>

  <!-- bedroom 1: desk, chair, bed -->
  <rect class="fx" x="150" y="800" width="460" height="1700" rx="20"/>
  <path class="fine" d="M150 1650 L610 1650"/>
  <circle class="fx" cx="930" cy="1650" r="230"/>
  <path class="fine" d="M790 1650 L1070 1650 M930 1510 L930 1790"/>
  <path class="fx" d="M1090 1440 A250 250 0 0 1 1090 1860"/>

  <rect class="fx" x="1300" y="150" width="1800" height="2000" rx="40"/>
  <rect class="fine" x="1360" y="200" width="810" height="350" rx="50"/>
  <rect class="fine" x="2230" y="200" width="810" height="350" rx="50"/>
