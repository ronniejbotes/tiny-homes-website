  <path class="fx" d="M3060 3175 L3060 2395"/>
  <path class="swing" d="M3060 2395 A780 780 0 0 0 2280 3175"/>
  <path class="fine" d="M2280 3175 L2280 3250 M3060 3175 L3060 3250"/>

